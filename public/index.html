<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>
    ULTIMATE TCS LEAGUE
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="brand">

        <div class="brand-logo">
          <img
            src="/images/logo.png"
            alt="UTL"
            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <span class="brand-fallback">
            UTL
          </span>
        </div>

        <div class="brand-text">
          <strong>
            ULTIMATE
          </strong>

          <span>
            TCS LEAGUE
          </span>
        </div>

      </div>

      <nav class="sidebar-nav">

        <button
          class="nav active"
          data-page="news"
          type="button"
        >
          <span class="nav-icon">▤</span>
          <span>News</span>
        </button>

        <button
          class="nav"
          data-page="table"
          type="button"
        >
          <span class="nav-icon">▦</span>
          <span>Tabela</span>
        </button>

        <button
          class="nav"
          data-page="players"
          type="button"
        >
          <span class="nav-icon">♙</span>
          <span>Jogadores</span>
        </button>

        <button
          class="nav"
          data-page="selections"
          type="button"
        >
          <span class="nav-icon">⚑</span>
          <span>Seleções</span>
        </button>

        <button
          class="nav"
          data-page="teams"
          type="button"
        >
          <span class="nav-icon">◈</span>
          <span>Times</span>
        </button>

        <button
          class="nav"
          data-page="admin"
          type="button"
        >
          <span class="nav-icon">⚙</span>
          <span>Admin Area</span>
        </button>

      </nav>

      <div class="sidebar-bottom">
        <span>
          UTL
        </span>

        <small>
          EST. 2026
        </small>
      </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

      <header class="topbar">

        <button
          class="hamb"
          id="mobileMenu"
          type="button"
          aria-label="Abrir menu"
        >
          ☰
        </button>

        <div class="topbar-title">

          <strong id="page-title">
            News
          </strong>

          <span>
            ULTIMATE TCS LEAGUE
          </span>

        </div>

      </header>


      <!-- =========================
           PAGE CONTENT
      ========================== -->

      <section
        id="page-content"
        class="page-content"
      ></section>

    </main>

  </div>


  <!-- =========================
       TOAST
  ========================== -->

  <div
    id="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="/app.js"></script>

</body>
</html>
