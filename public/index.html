<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ULTIMATE TCS LEAGUE</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <aside class="sidebar" id="sidebar">

      <div class="brand">

        <img
          src="/images/logo.png"
          alt="UTL"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
        >

        <span class="brand-fallback">UTL</span>

        <small>
          ULTIMATE TCS LEAGUE
        </small>

      </div>

      <nav>

        <button
          data-page="news"
          class="nav active"
        >
          <span>News</span>
        </button>

        <button
          data-page="table"
          class="nav"
        >
          <span>Tabela</span>
        </button>

        <button
          data-page="players"
          class="nav"
        >
          <span>Jogadores</span>
        </button>

        <button
          data-page="selections"
          class="nav"
        >
          <span>Seleções</span>
        </button>

        <button
          data-page="teams"
          class="nav"
        >
          <span>Times</span>
        </button>

        <button
          data-page="admin"
          class="nav"
        >
          <span>Admin Area</span>
        </button>

      </nav>

    </aside>


    <main class="main">

      <header class="topbar">

        <button
          class="hamb"
          id="mobileMenu"
          aria-label="Abrir menu"
        >
          ☰
        </button>

        <div>

          <b id="page-title">
            News
          </b>

          <span>
            ULTIMATE TCS LEAGUE
          </span>

        </div>

      </header>


      <section id="page-content"></section>

    </main>

  </div>


  <div id="toast"></div>


  <script src="/app.js"></script>

</body>
</html>
